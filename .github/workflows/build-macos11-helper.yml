name: Build macOS11+ BlueBubblesHelper dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods
        working-directory: Messages/MacOS-11+
        run: |
          pod install --repo-update

      - name: Build helper dylib
        working-directory: Messages/MacOS-11+
        run: |
          mkdir -p build-artifacts
          xcodebuild \
            -project Pods/Pods.xcodeproj \
            -target CocoaAsyncSocket \
            -configuration Release \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          xcodebuild \
            -project Pods/Pods.xcodeproj \
            -target "Pods-BlueBubblesHelper DyLib" \
            -configuration Release \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          xcodebuild \
            -workspace BlueBubblesHelper.xcworkspace \
            -scheme "BlueBubblesHelper DyLib" \
            -configuration Release \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find artifact
        run: |
          find Messages/MacOS-11+/build-artifacts -name 'BlueBubblesHelper.dylib' -print || true
          find ~/Library/Developer/Xcode/DerivedData -name 'BlueBubblesHelper.dylib' -print || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueBubblesHelper-macos11-dylib
          path: |
            Messages/MacOS-11+/build-artifacts/BlueBubblesHelper.dylib
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Release/BlueBubblesHelper.dylib
          if-no-files-found: error
